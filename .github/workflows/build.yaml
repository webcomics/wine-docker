---
name: Build Docker images
on:
  workflow_call:
    inputs:
      push:
        required: false
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: Build (and push) Docker image
    runs-on: ubuntu-24.04
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: tobix
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ inputs.push }}

      - name: Detect image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: tobix/wine

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Local build
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: tobix/wine:localtest
          labels: ${{ steps.meta.outputs.labels }}
          cache-to: type=local,dest=${{ runner.temp }}/buildx-cache,mode=max

      - name: Test image
        # systeminfo is a console app but tries to create windows in the
        # background, which makes it a good test for headless GUI stuff
        run: |
          docker run --rm \
            -e WINEDLLOVERRIDES="winemenubuilder.exe,mscoree,mshtml=" \
            tobix/wine:localtest \
            wlwine-run wine systeminfo

      - name: Build stable
        uses: docker/build-push-action@v7
        with:
          push: ${{ inputs.push }}
          tags: tobix/wine:stable
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WINE_FLAVOUR=stable
          cache-from: type=local,src=${{ runner.temp }}/buildx-cache

      - name: Build devel
        uses: docker/build-push-action@v7
        with:
          push: ${{ inputs.push }}
          tags: tobix/wine:devel
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WINE_FLAVOUR=devel
          cache-from: type=local,src=${{ runner.temp }}/buildx-cache

      - name: Build staging
        uses: docker/build-push-action@v7
        with:
          push: ${{ inputs.push }}
          tags: tobix/wine:staging
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WINE_FLAVOUR=staging
          cache-from: type=local,src=${{ runner.temp }}/buildx-cache
